appId: com.myraa.desktop
productName: MYRAA
copyright: Copyright © 2026 Mishtron Labs

directories:
  output: release
  buildResources: build

# Keep app resources unpacked for deterministic runtime path resolution.
asar: false

# Build hooks for PE resource metadata stamping, bundled native binary signing, and release verification.
afterPack: electron/scripts/afterPack.cjs
afterAllArtifactBuild: electron/scripts/afterAllArtifactBuild.cjs

files:
  - electron/main.cjs
  - electron/preload.cjs
  - electron/splash.html
  - assets/icon.ico
  - assets/avatar_idle.png
  - assets/avatar_talking.png
  - assets/avatar_thinking.png
  - dist/index.html
  - dist/favicon.svg
  - dist/mic-processor.worklet.js
  - dist/assets/**/*
  - dist/models/myraa.vrm
  - dist/models/myraa2.vrm
  - package.json
  - "!**/node_modules/**"
  - "!dist/server.cjs*"
  - "!**/*.map"
  - "!**/*-backup*"
  - "!desktop_agent/**"
  - "!run_agent.py"

# The PyInstaller-frozen desktop agent (embeds its own Python runtime) is copied
# into resources/agent, so the target machine needs no Python.
extraResources:
  - from: agent_dist/myraa-agent
    to: agent
    filter:
      - "**/*"
      - "!**/*.pyc"
      - "!**/__pycache__/**"
      - "!**/logs/**"

win:
  appId: com.myraa.desktop
  executableName: MYRAA
  icon: build/icon.ico
  legalTrademarks: MYRAA is a trademark of Mishtron Labs
  requestedExecutionLevel: asInvoker
  signAndEditExecutable: true
  signExts:
    - ".exe"
  signtoolOptions:
    publisherName:
      - Mishtron Labs
    signingHashAlgorithms:
      - sha256
    rfc3161TimeStampServer: http://timestamp.digicert.com
    timeStampServer: http://timestamp.digicert.com
    sign: electron/scripts/signWindowsExecutable.cjs
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: MYRAA
  uninstallDisplayName: MYRAA
  menuCategory: Mishtron Labs
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  include: build/installer.nsh
  artifactName: ${productName}-Setup-${version}.${ext}

portable:
  requestExecutionLevel: user
  artifactName: ${productName}-Portable-${version}.${ext}

